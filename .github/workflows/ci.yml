name: CI

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["v1", "main"]

# COST (2026-11-20, founder: Actions spend past $250): a newer push to the same PR cancels the superseded run, and the job has a
# timeout. Pushes to a branch group by commit SHA and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[mcp,pdf,watch]"
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Verify install works end-to-end
        run: |
          graphify --help
          graphify install
